[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cynergy"
version = "0.2.0"
description = "Agentic AI Development Platform - The next evolution of agentic AI frameworks. Build, connect, and scale intelligent systems with supercharged autonomy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cynergy Team"}]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "docker>=6.0.0",
    "asyncpg>=0.27.0",
    "aiomysql>=0.1.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = [
    "cynergy[openai,anthropic,web,connectors,security]",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
connectors = [
    "aiohttp>=3.9.0",
    "asyncpg>=0.27.0",
    "aiomysql>=0.1.0",
]
security = [
    "docker>=6.0.0",
],
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
]

[project.scripts]
cynergy = "cynergy.cli.main:cli"